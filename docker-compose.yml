name: sales-intel

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: sales_intel
      POSTGRES_PASSWORD: sales_intel_dev
      POSTGRES_DB: sales_intel
    ports:
      - "127.0.0.1:5440:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sales_intel"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6390:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
